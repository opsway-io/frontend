name: Build website

on:
  push:
    paths:
      - "apps/website/**"
      - "packages/ui/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF##*/}
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4

      - name: Build website application
        run: |
          pnpm install
          pnpm run build --filter website

      - name: Build and push Docker image for website
        uses: docker/build-push-action@v6
        with:
          context: ./apps/website
          push: true
          tags: |
            naueramant/opsway-website:${{ steps.prep.outputs.BUILD_ID }}
