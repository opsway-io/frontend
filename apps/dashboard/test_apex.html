
<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    var options = {
      series: [
        { name: 'Actual', type: 'line', data: [{x: 1000, y: 150}, {x: 2000, y: 160}] },
        { name: 'Expected', type: 'line', data: [{x: 1000, y: 145}, {x: 2000, y: 155}] },
        { name: 'Upper Bound', type: 'line', data: [{x: 1000, y: 200}, {x: 2000, y: 210}] },
        { name: 'Lower Bound', type: 'line', data: [{x: 1000, y: 100}, {x: 2000, y: 110}] },
        { name: 'Anomaly', type: 'line', data: [{x: 1000, y: null}, {x: 2000, y: 160}] }
      ],
      chart: { type: 'line', height: 350 },
      stroke: { curve: 'smooth', width: [3, 2, 1, 1, 0], dashArray: [0, 0, 5, 5, 0] },
      markers: { size: [0, 0, 0, 0, 6] },
      tooltip: {
        shared: true,
        intersect: false,
        y: {
          formatter: (value) => {
            if (value == null) return "N/A";
            return value + " ms";
          }
        }
      }
    };
    var chart = new ApexCharts(document.querySelector("#chart"), options);
    chart.render();
  </script>
</body>
</html>
