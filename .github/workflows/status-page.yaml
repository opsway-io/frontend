name: Build status page

on:
  push:
    branches:
      - main
    paths:
      - "apps/status-page/**"
      - "packages/ui/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build ID
        id: prep
        run: |
          branch=${GITHUB_REF##*/}
          sha=${GITHUB_SHA::8}
          ts=$(date +%s)
          echo "BUILD_ID=${branch}-${sha}-${ts}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: pnpm/action-setup@v4

      - name: Build status page application
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=status-page

      - name: Build and push Docker image for status page
        uses: docker/build-push-action@v6
        with:
          context: ./apps/status-page
          push: true
          tags: |
            naueramant/opsway-status-page:${{ steps.prep.outputs.BUILD_ID }}
